packages:
  - apps/*
  - packages/*
# Supply-chain cooldown: wait 3 days (value is in minutes) after a version is
# published before installing it, so compromised releases can be caught/yanked first.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@via-ds/components'
  - '@via-ds/eslint-plugin'
  - '@via-ds/icons'
  - '@via-ds/tokens'
overrides:
  # Legacy ESLint plugins require minimatch v3
  'minimatch@^3.0.0': '^3.1.5'
  'minimatch@>=7 <11': '^11.0.9'
  'brace-expansion@^1.0.0': '^1.1.21'
  'brace-expansion@^5.0.0': '^5.0.13'
allowBuilds:
  '@sentry/cli': false
  core-js-pure: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false
configDependencies:
  '@pnpm/plugin-types-fixer': 0.1.0+sha512-bLww63gRHi7siYTqFJb5qNdcXadU0jv20Et6z5AryMZ7FlLolbEJOrXLpg8+amQZNHHNW1dfFUBGVw/9ezQbFg==
