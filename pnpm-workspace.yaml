packages:
  - apps/*
  - packages/*
# Supply-chain cooldown: wait 3 days (value is in minutes) after a version is
# published before installing it, so compromised releases can be caught/yanked first.
minimumReleaseAge: 4320
# @opentelemetry/instrumentation-user-interaction regressed between
# 0.62.0 and 0.65.0, switching its internal patched-listener tracking from a Map to
# a WeakMap. @honeycombio/opentelemetry-web's bundled WebVitalsInstrumentation calls
# a bare `addEventListener(...)` (not `window.addEventListener(...)`), which under
# strict-mode ESM resolves `this` to `undefined`; the WeakMap-based tracker then
# throws "TypeError: Invalid value used as weak map key" during HoneycombWebSDK
# construction. Remove this override once upstream fixes the regression.
overrides:
  '@opentelemetry/instrumentation-user-interaction': 0.62.0
allowBuilds:
  '@sentry/cli': false
  core-js-pure: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false
configDependencies:
  '@pnpm/plugin-types-fixer': 0.1.0+sha512-bLww63gRHi7siYTqFJb5qNdcXadU0jv20Et6z5AryMZ7FlLolbEJOrXLpg8+amQZNHHNW1dfFUBGVw/9ezQbFg==
