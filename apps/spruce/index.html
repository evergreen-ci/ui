<!DOCTYPE html>
<html lang="en">

<head>
  %VITE_PROFILE_HEAD%
  <meta charset="utf-8" />
  <meta name="theme-color" content="#000000" />
  <meta name="git-hash" content="%VITE_GIT_SHA%" />
  <meta name="package-version" content="%VITE_APP_VERSION%" />
  <meta name="mode" content="%MODE%" />

  <link rel="shortcut icon" href="/favicon.ico" />

  <!--
        Spruce is light-only, but Via's stylesheet sets `color-scheme: light dark`
        at `:root`. Pinning it here rather than in GlobalStyles avoids a dark canvas
        on first paint, since Emotion only injects once React mounts. `html:root`
        beats Via's `:root` on specificity, which is what makes this hold both in
        dev (Vite injects Via's CSS after parse) and in prod (it ships as a link).
      -->
  <style>
    html:root {
      color-scheme: light;
    }
  </style>

  <title>Evergreen</title>
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>
  <div id="root" style="height: 100%"></div>
  <script type="module" src="/src/index.tsx"></script>
  <!--
        Load LeafyGreen's monospace font dependency via Google Fonts' CDN
      -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet" />
</body>

</html>
