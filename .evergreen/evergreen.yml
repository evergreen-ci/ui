command_type: test

ignore:
  - "*.md"
  - ".github/*"

modules:
  - name: evergreen
    owner: evergreen-ci
    repo: evergreen
    branch: main
    auto_update: true

pre:
  - func: assume-ec2-role
  - func: get-project
  - func: setup-pnpm-and-node
  - func: pnpm-install

post:
  - func: attach-analytics-visualizer
  - func: assume-ec2-role
  - func: attach-codegen-diff
  - func: attach-playwright-results
  - func: attach-email
  - func: attach-mongod-logs
  - func: attach-restore-logs
  - func: attach-source-map
  - func: attach-storybook
  - func: attach-test-results

include:
  - filename: .evergreen/attach.yml
  - filename: .evergreen/deploy.yml
  - filename: .evergreen/shared.yml

buildvariants:
  - name: spruce
    display_name: Spruce
    activate: true
    paths:
      - "apps/spruce/**"
      - "packages/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    run_on:
      - ubuntu2204-small
    expansions:
      app_dir: apps/spruce
      goroot: /opt/golang/go1.26
      mongodb_tools_url: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.11.0.tgz
      mongodb_url_2204: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.4.tgz
      mongosh_url_2204: https://downloads.mongodb.com/compass/mongosh-2.3.1-linux-x64.tgz
    modules:
      - evergreen
    tasks:
      - name: check_codegen
      - name: compile
      - name: ".spruce-e2e-shard"
        run_on: ubuntu2204-large
      - name: lint
      - name: storybook
      - name: test
      - name: type_check
      - name: deploy-spruce-prod
        git_tag_only: true
        patchable: false
        priority: 100
    display_tasks:
      - name: e2e_parallel
        execution_tasks:
          - e2e_spruce_1
          - e2e_spruce_2
          - e2e_spruce_3
          - e2e_spruce_4

  - name: parsley
    display_name: Parsley
    activate: true
    paths:
      - "apps/parsley/**"
      - "packages/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    expansions:
      app_dir: apps/parsley
      goroot: /opt/golang/go1.26
      mongodb_tools_url: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.11.0.tgz
      mongodb_url_2204: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.4.tgz
      mongosh_url_2204: https://downloads.mongodb.com/compass/mongosh-2.3.1-linux-x64.tgz
    run_on:
      - ubuntu2204-small
    modules:
      - evergreen
    tasks:
      - name: check_codegen
      - name: compile
      - name: e2e
        run_on: ubuntu2204-large
      - name: lint
      - name: storybook
      - name: test
      - name: type_check
      - name: deploy-parsley-prod
        git_tag_only: true
        patchable: false
        priority: 100

  - name: lib
    display_name: Lib
    activate: true
    paths:
      - "packages/eslint-config/**"
      - "packages/lib/**"
      - "packages/storybook-config/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    expansions:
      app_dir: packages/lib
      goroot: /opt/golang/go1.26
    run_on:
      - ubuntu2204-small
    modules:
      - evergreen
    tasks:
      - name: lint
      - name: storybook
      - name: test
      - name: type_check
      - name: check_codegen

  - name: deploy-utils
    display_name: Deploy Utils
    activate: true
    paths:
      - "packages/eslint-config/**"
      - "packages/deploy-utils/**"
      - "packages/storybook-config/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    expansions:
      app_dir: packages/deploy-utils
      goroot: /opt/golang/go1.26
    run_on:
      - ubuntu2204-small
    tasks:
      - name: lint
      - name: test
      - name: type_check

  - name: fungi
    display_name: Fungi
    activate: true
    paths:
      - "packages/fungi/**"
      - "packages/eslint-config/**"
      - "packages/lib/**"
      - "packages/storybook-config/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    expansions:
      app_dir: packages/fungi
      goroot: /opt/golang/go1.26
    run_on:
      - ubuntu2204-small
    tasks:
      - name: lint
      - name: storybook
      - name: test
      - name: type_check

  - name: analytics-visualizer
    display_name: Analytics Visualizer
    activate: true
    paths:
      - "packages/analytics-visualizer/**"
      - "packages/eslint-config/**"
      - ".evergreen/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    expansions:
      app_dir: packages/analytics-visualizer
    run_on:
      - ubuntu2204-small
    tasks:
      - name: lint
      - name: test
      - name: type_check

  - name: deploy
    display_name: Deploys
    activate: false
    run_on:
      - ubuntu2204-large
    tasks:
      - name: deploy-parsley-beta
      - name: deploy-parsley-staging
      - name: deploy-spruce-beta
      - name: deploy-spruce-staging
      - name: sync-spruce-staging

parameters:
  - key: playwright_spec
    value: ""
    description: Specify Playwright spec files to run in E2E tasks.
